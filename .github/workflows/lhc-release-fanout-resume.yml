name: Codex LHC v0.149 bounded fanout resume

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.149.0"
        type: string

permissions:
  contents: read

concurrency:
  group: codex-lhc-v0.149-fanout-resume-${{ inputs.version }}
  cancel-in-progress: false

env:
  PRODUCT_SOURCE: a25a81a8d7d6cbd6234011ad3787cd7e59a1f489
  WORKFLOW_SOURCE: ${{ github.sha }}
  LHC_SDK_COMMIT: 9d4d18247942f35b356f28bdc4288f0e631a6da9
  VERSION: ${{ inputs.version }}

jobs:
  retained-boundary:
    name: Verify retained a25 seed and qualification before fanout
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove retained-boundary workflow identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_SOURCE" != "$PRODUCT_SOURCE"
          git merge-base --is-ancestor "$PRODUCT_SOURCE" "$WORKFLOW_SOURCE"
          test -z "$(git status --porcelain=v1)"
      - name: Query and download retained artifacts by immutable IDs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p retained
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/32669557893" > retained/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/97274114206" > retained/job.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9501623903" > retained/seed-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9501839613" > retained/qualification-artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9501623903/zip" > retained/seed-artifact.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9501839613/zip" > retained/qualification-artifact.zip
      - name: Refuse retained run, job, artifact, digest, or evidence mismatch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lhc-release/verify_fanout_resume.py \
            --version "$VERSION" \
            --workflow-source "$WORKFLOW_SOURCE" \
            --current-run-id "$GITHUB_RUN_ID" \
            --run-json retained/run.json \
            --job-json retained/job.json \
            --seed-artifact-json retained/seed-artifact.json \
            --qualification-artifact-json retained/qualification-artifact.json \
            --seed-download retained/seed-artifact.zip \
            --qualification-download retained/qualification-artifact.zip \
            --receipt-output retained/retained-boundary-receipt.json
      - name: Upload exact green retained boundary for later reverification
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-retained-boundary
          path: retained/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  preflight-macos-bash32:
    name: Preflight workflow-source Bash 3.2 portability
    needs: retained-boundary
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Prove distinct workflow source and exact SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_SOURCE" != "$PRODUCT_SOURCE"
          git merge-base --is-ancestor "$PRODUCT_SOURCE" "$WORKFLOW_SOURCE"
          test "$(git -C codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)" = "$LHC_SDK_COMMIT"
          test -z "$(git status --porcelain=v1 --ignore-submodules=none)"
      - name: Exercise synthetic musl installer under native Bash 3.2
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -c 'test "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2'
          PATH=/usr/bin:/bin /usr/bin/python3 \
            scripts/lhc-release/test_install_musl_build_tools.py

  preflight-linux-arm64:
    name: Preflight workflow-source Linux ARM64 installer mapping
    needs: retained-boundary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Prove distinct workflow source and exact SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_SOURCE" != "$PRODUCT_SOURCE"
          git merge-base --is-ancestor "$PRODUCT_SOURCE" "$WORKFLOW_SOURCE"
          test "$(git -C codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)" = "$LHC_SDK_COMMIT"
          test -z "$(git status --porcelain=v1 --ignore-submodules=none)"
          test "$(uname -m)" = aarch64
      - name: Exercise native fixture mapping and release tests
        run: python3 -m unittest discover -s scripts/lhc-release -p 'test_*.py'

  build-resumed-platforms:
    name: Build a25 product ${{ matrix.platform }}
    needs: [retained-boundary, preflight-macos-bash32, preflight-linux-arm64]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-aarch64, target: aarch64-apple-darwin, kind: macos, archive: tar.gz, runs_on: blacksmith-12vcpu-macos-15 }
          - { platform: linux-aarch64, target: aarch64-unknown-linux-musl, kind: linux, archive: tar.gz, runs_on: ubuntu-24.04-arm }
          - { platform: windows-x86_64, target: x86_64-pc-windows-msvc, kind: windows, archive: zip, runs_on: blacksmith-32vcpu-windows-2025 }
          - { platform: windows-aarch64, target: aarch64-pc-windows-msvc, kind: windows, archive: zip, runs_on: windows-11-arm }
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      LIBSQLITE3_FLAGS: ${{ matrix.kind == 'windows' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Fresh full checkout of accepted product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: a25a81a8d7d6cbd6234011ad3787cd7e59a1f489
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          clean: true
      - name: Fence product checkout from workflow source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test "$WORKFLOW_SOURCE" != "$PRODUCT_SOURCE"
          git merge-base --is-ancestor "$PRODUCT_SOURCE" "$WORKFLOW_SOURCE"
          test "$(git -C codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)" = "$LHC_SDK_COMMIT"
          test "$(git ls-tree HEAD codex-rs/lhc/vendor/long-horizon-context | awk '{print $3}')" = "$LHC_SDK_COMMIT"
          test -z "$(git status --porcelain=v1 --ignore-submodules=none)"
          test ! -e .github/workflows/lhc-release-fanout-resume.yml
          git diff --quiet "$PRODUCT_SOURCE" -- .
          python scripts/lhc-release/check_version_identity.py --version "$VERSION"
      - uses: ./.github/actions/setup-ci
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl build tools
        if: matrix.kind == 'linux'
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - name: Configure Windows build paths
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $targetDir = Join-Path $env:RUNNER_TEMP "codex-target"
          New-Item $targetDir -ItemType Directory -Force | Out-Null
          "CARGO_TARGET_DIR=$targetDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ./.github/actions/setup-msvc-env
        if: matrix.kind == 'windows'
        with:
          target: ${{ matrix.target }}
      - name: Test canonical package builder
        shell: bash
        run: python -m unittest discover -s scripts/codex_package -p 'test_*.py'
      - name: Test release helpers with one platform-specific preflight exemption
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.kind }}" in
            macos) exempted_test=test_install_musl_build_tools.py ;;
            linux) exempted_test=test_install.py ;;
            *) echo "unexpected POSIX build kind: ${{ matrix.kind }}" >&2; exit 1 ;;
          esac
          set --
          for test_file in scripts/lhc-release/test_*.py; do
            if [[ "$(basename "$test_file")" == "$exempted_test" ]]; then
              continue
            fi
            set -- "$@" "$test_file"
          done
          test "$#" -gt 0
          python -m unittest "$@"
      - name: Test Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./scripts/lhc-release/test_install.ps1
      - name: Build, verify, and smoke canonical a25 package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test -z "$(git status --porcelain=v1 --untracked-files=no --ignore-submodules=none)"
          package_dir="${RUNNER_TEMP}/codex-lhc-${PLATFORM}"
          archive="dist/codex-lhc-v${VERSION}-${PLATFORM}.${{ matrix.archive }}"
          mkdir -p dist
          python scripts/build_codex_package.py \
            --target "$TARGET" --variant codex --package-version "$VERSION" \
            --cargo-profile release --package-dir "$package_dir" \
            --archive-output "$archive" \
            --lhc-sdk-commit "$LHC_SDK_COMMIT" \
            --lhc-thread-schema 11 --force
          python scripts/lhc-release/verify_package_archive.py \
            --archive "$archive" --platform "$PLATFORM" --version "$VERSION" \
            --lhc-sdk-commit "$LHC_SDK_COMMIT"
          suffix=""
          if [[ "${{ matrix.kind }}" == windows ]]; then suffix=.exe; fi
          test "$("$package_dir/bin/codex${suffix}" --version)" = "codex-cli $VERSION"
          "$package_dir/bin/codex-code-mode-host${suffix}" --help >/dev/null
          "$package_dir/codex-path/rg${suffix}" --version >/dev/null
          if [[ "${{ matrix.kind }}" == linux ]]; then
            "$package_dir/codex-resources/bwrap" --version >/dev/null
            "$package_dir/codex-resources/zsh/bin/zsh" --version >/dev/null
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=no --ignore-submodules=none)"
      - name: Record immutable dual-source platform receipt
        shell: bash
        env:
          ARCHIVE_KIND: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test -z "$(git status --porcelain=v1 --untracked-files=no --ignore-submodules=none)"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          archive = Path("dist") / (
              f"codex-lhc-v{os.environ['VERSION']}-{os.environ['PLATFORM']}."
              f"{os.environ['ARCHIVE_KIND']}"
          )
          receipt = {
              "schemaVersion": 1,
              "platform": os.environ["PLATFORM"],
              "target": os.environ["TARGET"],
              "archive": archive.name,
              "archiveSha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "archiveBytes": archive.stat().st_size,
              "productSource": os.environ["PRODUCT_SOURCE"],
              "workflowSource": os.environ["WORKFLOW_SOURCE"],
              "lhcSdkCommit": os.environ["LHC_SDK_COMMIT"],
              "sourceTreeClean": True,
              "buildRunId": os.environ["GITHUB_RUN_ID"],
          }
          (Path("dist") / f"provenance-{os.environ['PLATFORM']}.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload immutable resumed platform archive and receipt
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-resume-${{ matrix.platform }}
          path: |
            dist/codex-lhc-v${{ inputs.version }}-${{ matrix.platform }}.${{ matrix.archive }}
            dist/provenance-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 30

  candidate:
    name: Aggregate qualified a25 seed and exact resumed fanout
    needs: [retained-boundary, build-resumed-platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout workflow source for resumed orchestration only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Prove workflow source remains distinct from product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SOURCE"
          test "$WORKFLOW_SOURCE" != "$PRODUCT_SOURCE"
          git merge-base --is-ancestor "$PRODUCT_SOURCE" "$WORKFLOW_SOURCE"
          test -z "$(git status --porcelain=v1 --ignore-submodules=none)"
      - name: Fresh full checkout of accepted product tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: product-source
          ref: a25a81a8d7d6cbd6234011ad3787cd7e59a1f489
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          clean: true
      - name: Prove aggregate product tooling identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product-source rev-parse HEAD)" = "$PRODUCT_SOURCE"
          test "$(git -C product-source/codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)" = "$LHC_SDK_COMMIT"
          test -z "$(git -C product-source status --porcelain=v1 --ignore-submodules=none)"
          test ! -e product-source/.github/workflows/lhc-release-fanout-resume.yml
          python3 product-source/scripts/lhc-release/check_version_identity.py --version "$VERSION"
      - name: Download exact four current-run platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-lhc-resume-*
          path: fanout
          merge-multiple: true
      - name: Download green retained boundary from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-retained-boundary
          path: retained
      - name: Refuse any cross-run artifact, qualification, or provenance mismatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          python3 scripts/lhc-release/verify_fanout_resume.py \
            --version "$VERSION" \
            --workflow-source "$WORKFLOW_SOURCE" \
            --current-run-id "$GITHUB_RUN_ID" \
            --run-json retained/run.json \
            --job-json retained/job.json \
            --seed-artifact-json retained/seed-artifact.json \
            --qualification-artifact-json retained/qualification-artifact.json \
            --seed-download retained/seed-artifact.zip \
            --qualification-download retained/qualification-artifact.zip \
            --platform-root fanout \
            --receipt-output candidate/fanout-resume-receipt.json
          unzip -q retained/seed-artifact.zip -d retained/seed
          cp "retained/seed/codex-lhc-v${VERSION}-linux-x86_64.tar.gz" candidate/
          cp retained/qualification-artifact.zip \
            candidate/codex-lhc-linux-x86_64-qualification-evidence.zip
          for platform in linux-aarch64 macos-aarch64; do
            cp "fanout/codex-lhc-v${VERSION}-${platform}.tar.gz" candidate/
          done
          for platform in windows-x86_64 windows-aarch64; do
            cp "fanout/codex-lhc-v${VERSION}-${platform}.zip" candidate/
          done
      - name: Reverify exactly five a25 package archives with a25 tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(find candidate -maxdepth 1 -type f -name 'codex-lhc-v*' | wc -l)" -eq 5
          for platform in linux-x86_64 linux-aarch64 macos-aarch64; do
            python3 product-source/scripts/lhc-release/verify_package_archive.py \
              --archive "candidate/codex-lhc-v${VERSION}-${platform}.tar.gz" \
              --platform "$platform" --version "$VERSION" \
              --lhc-sdk-commit "$LHC_SDK_COMMIT"
          done
          for platform in windows-x86_64 windows-aarch64; do
            python3 product-source/scripts/lhc-release/verify_package_archive.py \
              --archive "candidate/codex-lhc-v${VERSION}-${platform}.zip" \
              --platform "$platform" --version "$VERSION" \
              --lhc-sdk-commit "$LHC_SDK_COMMIT"
          done
      - name: Write dual-source candidate metadata and checksums
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 product-source/scripts/lhc-release/install.sh candidate/install.sh
          cp product-source/scripts/lhc-release/install.ps1 candidate/install.ps1
          git -C product-source show "$PRODUCT_SOURCE:lhc-release/notes/v${VERSION}.md" \
            > candidate/RELEASE_NOTES.md
          cat >> candidate/RELEASE_NOTES.md <<EOF

          ---

          - Product source: ${PRODUCT_SOURCE}
          - Resumed orchestration workflow source: ${WORKFLOW_SOURCE}
          - Qualified Linux x86_64 seed run: 32669557893
          - Qualification job: 97274114206 (success)
          - This candidate is not a tag, release, or public promotion.
          EOF
          python3 scripts/lhc-release/make_manifest.py \
            --dist candidate --version "$VERSION" \
            --source-commit "$PRODUCT_SOURCE" \
            --workflow-source "$WORKFLOW_SOURCE" \
            --resume-receipt candidate/fanout-resume-receipt.json \
            --upstream-commit "$(tr -d '[:space:]' < product-source/patches/lhc/BASE)" \
            --lhc-sdk-commit "$LHC_SDK_COMMIT" \
            --run-id "$GITHUB_RUN_ID" \
            --expected-platform linux-x86_64 --expected-platform linux-aarch64 \
            --expected-platform windows-x86_64 --expected-platform windows-aarch64 \
            --expected-platform macos-aarch64
          (cd candidate && sha256sum -c SHA256SUMS)
      - name: Upload immutable five-platform resumed candidate only
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-v${{ inputs.version }}-fanout-resume-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
