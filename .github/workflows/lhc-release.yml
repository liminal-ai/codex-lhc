name: Codex LHC five-platform candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.149.2"
        type: string

permissions:
  contents: read

concurrency:
  group: codex-lhc-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  seed:
    name: Build and verify linux-x86_64 seed
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      PLATFORM: linux-x86_64
      TARGET: x86_64-unknown-linux-musl
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Validate release and public SDK identity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/lhc-release/check_version_identity.py --version "$VERSION"
          sdk_dir=codex-rs/lhc/vendor/long-horizon-context
          sdk_commit="$(git -C "$sdk_dir" rev-parse HEAD)"
          test "$sdk_commit" = 5207952b0d6d5dadb95f810c75a18e0867da6b72
          git -C "$sdk_dir" fetch --no-tags origin main
          git -C "$sdk_dir" merge-base --is-ancestor "$sdk_commit" origin/main
      - uses: ./.github/actions/setup-ci
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl build tools
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - name: Test canonical package builder
        run: python -m unittest discover -s scripts/codex_package -p 'test_*.py'
      - name: Test release helpers and POSIX installer
        run: python -m unittest discover -s scripts/lhc-release -p 'test_*.py'
      - name: Build canonical Codex-LHC seed archive
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/codex-lhc-${PLATFORM}"
          archive="dist/codex-lhc-v${VERSION}-${PLATFORM}.tar.gz"
          mkdir -p dist
          python scripts/build_codex_package.py \
            --target "$TARGET" --variant codex --package-version "$VERSION" \
            --cargo-profile release --package-dir "$package_dir" \
            --archive-output "$archive" \
            --lhc-sdk-commit 5207952b0d6d5dadb95f810c75a18e0867da6b72 \
            --lhc-thread-schema 12 --force
          python scripts/lhc-release/verify_package_archive.py \
            --archive "$archive" --platform "$PLATFORM" --version "$VERSION" \
            --lhc-sdk-commit 5207952b0d6d5dadb95f810c75a18e0867da6b72
      - name: Prove default LHC capture on seed
        run: >-
          python scripts/check-lhc-default-capture.py
          --binary "${RUNNER_TEMP}/codex-lhc-${PLATFORM}/bin/codex"
      - name: Upload exact verified seed archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-linux-x86_64
          path: dist/codex-lhc-v${{ inputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  qualify-seed:
    name: Qualify exact downloaded linux-x86_64 seed
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Download exact seed archive without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-linux-x86_64
          path: seed
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Verify downloaded canonical package
        run: |
          set -euo pipefail
          archive="seed/codex-lhc-v${VERSION}-linux-x86_64.tar.gz"
          python scripts/lhc-release/check_version_identity.py --version "$VERSION"
          python scripts/lhc-release/verify_package_archive.py \
            --archive "$archive" --platform linux-x86_64 --version "$VERSION" \
            --lhc-sdk-commit 5207952b0d6d5dadb95f810c75a18e0867da6b72
          (cd seed && sha256sum "codex-lhc-v${VERSION}-linux-x86_64.tar.gz" > SHA256SUMS)
      - name: Run supplemental source regressions (not artifact qualification)
        working-directory: codex-rs
        env:
          RUST_MIN_STACK: "8388608"
        run: |
          set -euo pipefail
          cargo test --locked -p codex-linux-sandbox bundled_bwrap
          cargo test --locked -p codex-app-server-daemon \
            seed_managed_codex_copies_running_fork_bytes_into_isolated_home
          cargo test --locked -p lhc --test view_compact_bounded
          cargo test --locked -p codex-lhc-host --lib materialize
          cargo test --locked -p codex-core --lib slice_d_ -- --test-threads=1
          cargo test --locked -p codex-core --lib \
            c1_resume_after_compact_no_reingest_and_durable_provenance_survives \
            -- --test-threads=1
      - name: Install and exercise the exact downloaded seed
        run: |
          set -euo pipefail
          archive="seed/codex-lhc-v${VERSION}-linux-x86_64.tar.gz"
          prefix="${RUNNER_TEMP}/codex-lhc-seed-prefix"
          store="${RUNNER_TEMP}/codex-lhc-seed-store"
          home="${RUNNER_TEMP}/codex-lhc-seed-home"
          codex_home="${RUNNER_TEMP}/codex-lhc-seed-codex-home"
          lhc_root="${RUNNER_TEMP}/codex-lhc-seed-lhc"
          mkdir -p "$home" "$codex_home" "$lhc_root"
          install -m 0755 scripts/lhc-release/install.sh seed/install.sh
          HOME="$home" sh seed/install.sh \
            --asset-dir "$(pwd)/seed" --version "$VERSION" \
            --name codex-lhc-seed --prefix "$prefix" --install-root "$store"
          launcher="$prefix/bin/codex-lhc-seed"
          package="$store/versions/$VERSION"
          test "$("$launcher" --version)" = "codex-cli $VERSION"
          "$package/bin/codex-code-mode-host" --help >/dev/null
          "$package/codex-path/rg" --version >/dev/null
          "$package/codex-resources/bwrap" --version >/dev/null
          HOME="$home" CODEX_HOME="$codex_home" CODEX_LHC_ROOT="$lhc_root" \
            "$launcher" app-server generate-json-schema --experimental \
            --out "${RUNNER_TEMP}/codex-lhc-seed-app-server-schema"
          test -n "$(find "${RUNNER_TEMP}/codex-lhc-seed-app-server-schema" -type f -print -quit)"
          daemon_home="${RUNNER_TEMP}/codex-lhc-seed-daemon-home"
          mkdir -p "$daemon_home"
          bootstrap="$(HOME="$home" CODEX_HOME="$daemon_home" \
            timeout 30 "$launcher" app-server daemon bootstrap)"
          managed="$(jq -r .managedCodexPath <<<"$bootstrap")"
          test "$(jq -r .managedCodexVersion <<<"$bootstrap")" = "$VERSION"
          test "$(jq -r .appServerVersion <<<"$bootstrap")" = "$VERSION"
          cmp "$package/bin/codex" "$managed"
          HOME="$home" CODEX_HOME="$daemon_home" \
            timeout 30 "$launcher" app-server daemon stop >/dev/null
          env -u LHC_COMPACT_ALGORITHM \
            python scripts/check-lhc-installed-lifecycle.py \
              --binary "$launcher" --mode metadata-first \
              --root "${RUNNER_TEMP}/codex-lhc-seed-default-lifecycle"
          LHC_COMPACT_ALGORITHM=legacy \
            python scripts/check-lhc-installed-lifecycle.py \
              --binary "$launcher" --mode legacy \
              --root "${RUNNER_TEMP}/codex-lhc-seed-legacy-lifecycle"
          HOME="$home" sh seed/install.sh \
            --name codex-lhc-seed --prefix "$prefix" --install-root "$store" \
            --uninstall
          test ! -e "$launcher"
          test ! -e "$store"
          test -n "$(find "${RUNNER_TEMP}/codex-lhc-seed-default-lifecycle/lhc/threads" \
            -name '*.sqlite' -type f -print -quit)"
          test -n "$(find "${RUNNER_TEMP}/codex-lhc-seed-legacy-lifecycle/lhc/threads" \
            -name '*.sqlite' -type f -print -quit)"
      - name: Preserve installed lifecycle qualification evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-linux-x86_64-qualification-evidence
          path: |
            ${{ runner.temp }}/codex-lhc-seed-default-lifecycle/evidence
            ${{ runner.temp }}/codex-lhc-seed-legacy-lifecycle/evidence
          if-no-files-found: warn
          retention-days: 30

  build-remaining:
    name: Build ${{ matrix.platform }} after seed
    needs: qualify-seed
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-aarch64, target: aarch64-unknown-linux-musl, kind: linux, archive: tar.gz, runs_on: ubuntu-24.04-arm }
          - { platform: windows-x86_64, target: x86_64-pc-windows-msvc, kind: windows, archive: zip, runs_on: blacksmith-32vcpu-windows-2025 }
          - platform: windows-aarch64
            target: aarch64-pc-windows-msvc
            kind: windows
            archive: zip
            runs_on: windows-11-arm
          - { platform: macos-aarch64, target: aarch64-apple-darwin, kind: macos, archive: tar.gz, runs_on: blacksmith-12vcpu-macos-15 }
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      LIBSQLITE3_FLAGS: ${{ matrix.kind == 'windows' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Validate release and public SDK identity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/lhc-release/check_version_identity.py --version "$VERSION"
          sdk_dir=codex-rs/lhc/vendor/long-horizon-context
          sdk_commit="$(git -C "$sdk_dir" rev-parse HEAD)"
          test "$sdk_commit" = 5207952b0d6d5dadb95f810c75a18e0867da6b72
          git -C "$sdk_dir" fetch --no-tags origin main
          git -C "$sdk_dir" merge-base --is-ancestor "$sdk_commit" origin/main
      - uses: ./.github/actions/setup-ci
        if: matrix.kind != 'windows'
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl build tools
        if: matrix.kind == 'linux'
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - name: Normalize accepted a25 GCC frame warning option
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          invalid_option=-Wno-error=frame-larger-than
          corrected_option=-Wno-error=frame-larger-than=
          normalize_flags() {
            local input="$1"
            local flag output="" replacements=0
            local -a flags
            read -r -a flags <<< "$input"
            for flag in "${flags[@]}"; do
              if [[ "$flag" == "$invalid_option" ]]; then
                flag="$corrected_option"
                replacements=$((replacements + 1))
              fi
              output="${output:+${output} }${flag}"
            done
            test "$replacements" -eq 1 || {
              echo "expected exactly one standalone $invalid_option" >&2
              exit 1
            }
            NORMALIZED_FLAGS="$output"
          }
          normalize_flags "$CFLAGS"
          corrected_cflags="$NORMALIZED_FLAGS"
          normalize_flags "$CXXFLAGS"
          corrected_cxxflags="$NORMALIZED_FLAGS"
          case " $corrected_cflags " in *" $invalid_option "*) exit 1 ;; esac
          case " $corrected_cxxflags " in *" $invalid_option "*) exit 1 ;; esac
          printf '%s\n' 'int codex_frame_option_probe(void) { return 0; }' | \
            "$CC" "$corrected_option" -x c -c \
              -o "${RUNNER_TEMP}/frame-option-probe.o" -
          printf 'CFLAGS=%s\nCXXFLAGS=%s\n' \
            "$corrected_cflags" "$corrected_cxxflags" >> "$GITHUB_ENV"
      - name: Configure Windows build paths
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $targetDir = Join-Path $env:RUNNER_TEMP "codex-target"
          New-Item $targetDir -ItemType Directory -Force | Out-Null
          "CARGO_TARGET_DIR=$targetDir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ./.github/actions/setup-msvc-env
        if: matrix.kind == 'windows'
        with:
          target: ${{ matrix.target }}
      - name: Test canonical package builder
        if: matrix.kind != 'windows'
        shell: bash
        run: python -m unittest discover -s scripts/codex_package -p 'test_*.py'
      - name: Test exactly 11 applicable canonical package tests on Windows
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # POSIX executable-mode omissions on native Windows:
          # - test_layout.PackageLayoutTest.test_app_server_package_places_code_mode_host_beside_entrypoint
          # - test_layout.PackageLayoutTest.test_macos_package_preserves_prebuilt_resource_binaries
          # - test_zsh.ResolveZshBinTest.test_uses_prebuilt_executable_override
          # Carried forward as omissions from the same proven list, and covered
          # in full by the POSIX jobs above:
          # - test_cargo.SourceBinariesForTargetTest.test_linux_package_with_prebuilt_entrypoint_and_bwrap_builds_nothing
          # - test_cargo.SourceBinariesForTargetTest.test_macos_package_with_prebuilt_entrypoint_builds_nothing
          # - test_cargo.SourceBinariesForTargetTest.test_missing_code_mode_host_is_built_for_app_server
          PYTHONPATH=scripts/codex_package python -m unittest \
            test_archive.ResolveZstdCommandTest.test_prefers_zstd_from_path \
            test_archive.ResolveZstdCommandTest.test_falls_back_to_dotslash_manifest \
            test_archive.ResolveZstdCommandTest.test_errors_when_no_zstd_or_dotslash_manifest_is_available \
            test_cargo.SourceBinariesForTargetTest.test_windows_package_with_prebuilt_entrypoint_and_helpers_builds_nothing \
            test_cargo.SourceBinariesForTargetTest.test_missing_windows_helpers_are_built \
            test_cargo.SourceBinariesForTargetTest.test_build_uses_prebuilt_windows_helpers_without_running_cargo \
            test_cli.PackageVersionTest.test_lhc_provenance_requires_exact_public_identity_pair \
            test_cli.PackageVersionTest.test_accepts_release_prerelease_and_build_versions \
            test_cli.PackageVersionTest.test_rejects_versions_the_runtime_cannot_parse \
            test_layout.PackageLayoutTest.test_lhc_package_extends_canonical_metadata_with_exact_provenance \
            test_zsh.ResolveZshBinTest.test_uses_manifest_override
      - name: Test release helpers and POSIX installer
        if: matrix.kind == 'linux'
        shell: bash
        run: python -m unittest discover -s scripts/lhc-release -p 'test_*.py'
      - name: Test release helpers except the Linux-only musl helper
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          # test_install_musl_build_tools.py exercises the Linux-only musl UAPI
          # helper in .github/scripts/install-musl-build-tools.sh; it is not
          # applicable on macOS. Every other release helper test still runs,
          # including the POSIX installer fixture coverage.
          exempted_test=test_install_musl_build_tools.py
          set --
          for test_file in scripts/lhc-release/test_*.py; do
            if [[ "$(basename "$test_file")" == "$exempted_test" ]]; then
              continue
            fi
            set -- "$@" "$test_file"
          done
          test "$#" -gt 0
          PYTHONPATH="scripts/lhc-release${PYTHONPATH:+:${PYTHONPATH}}" \
            python -m unittest "$@"
      - name: Test Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./scripts/lhc-release/test_install.ps1
      - name: Build canonical Codex-LHC package archive
        shell: bash
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/codex-lhc-${PLATFORM}"
          archive="dist/codex-lhc-v${VERSION}-${PLATFORM}.${{ matrix.archive }}"
          mkdir -p dist
          python scripts/build_codex_package.py \
            --target "$TARGET" --variant codex --package-version "$VERSION" \
            --cargo-profile release --package-dir "$package_dir" \
            --archive-output "$archive" \
            --lhc-sdk-commit 5207952b0d6d5dadb95f810c75a18e0867da6b72 \
            --lhc-thread-schema 12 --force
          python scripts/lhc-release/verify_package_archive.py \
            --archive "$archive" --platform "$PLATFORM" --version "$VERSION" \
            --lhc-sdk-commit 5207952b0d6d5dadb95f810c75a18e0867da6b72
      - name: Upload immutable platform archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-${{ matrix.platform }}
          path: dist/codex-lhc-v${{ inputs.version }}-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  candidate:
    name: Assemble immutable five-platform candidate
    needs: [qualify-seed, build-remaining]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-lhc-*
          path: candidate
          merge-multiple: true
      - name: Verify and record exact aggregate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          install -m 0755 scripts/lhc-release/install.sh candidate/install.sh
          cp scripts/lhc-release/install.ps1 candidate/install.ps1
          for platform in linux-x86_64 linux-aarch64 macos-aarch64; do
            python scripts/lhc-release/verify_package_archive.py \
              --archive "candidate/codex-lhc-v${VERSION}-${platform}.tar.gz" \
              --platform "$platform" --version "$VERSION" \
              --lhc-sdk-commit 5207952b0d6d5dadb95f810c75a18e0867da6b72
          done
          for platform in windows-x86_64 windows-aarch64; do
            python scripts/lhc-release/verify_package_archive.py \
              --archive "candidate/codex-lhc-v${VERSION}-${platform}.zip" \
              --platform "$platform" --version "$VERSION" \
              --lhc-sdk-commit 5207952b0d6d5dadb95f810c75a18e0867da6b72
          done
          python scripts/lhc-release/make_manifest.py \
            --dist candidate --version "$VERSION" \
            --source-commit "$(git rev-parse HEAD)" \
            --upstream-commit "$(tr -d '[:space:]' < patches/lhc/BASE)" \
            --lhc-sdk-commit "$(git -C codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --expected-platform linux-x86_64 --expected-platform linux-aarch64 \
            --expected-platform windows-x86_64 --expected-platform windows-aarch64 \
            --expected-platform macos-aarch64
          (cd candidate && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-v${{ inputs.version }}-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
