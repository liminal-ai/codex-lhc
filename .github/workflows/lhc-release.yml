# Build and optionally publish the Codex + LHC product release.
#
# The first release lane is intentionally Linux x86_64 only. Run once with
# publish=false, validate the retained artifact, then rerun the same commit with
# publish=true. macOS and Windows join this matrix only after their install and
# uninstall paths have equivalent production-path coverage.

name: Codex LHC release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the v prefix"
        required: true
        default: "0.1.0"
        type: string
      publish:
        description: "Create the vX.Y.Z GitHub Release after validation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: codex-lhc-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build and exercise Linux x86_64
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 180
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Resolve and validate release identity
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
            || { echo "invalid SemVer: $version" >&2; exit 1; }
          expected="$(tr -d '[:space:]' < lhc-release/VERSION)"
          [[ "$version" == "$expected" ]] \
            || { echo "requested $version, source declares $expected" >&2; exit 1; }
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/cli/Cargo.toml)"
          [[ "$version" == "$cargo_version" ]] \
            || { echo "requested $version, codex-cli declares $cargo_version" >&2; exit 1; }
          if [[ "${{ inputs.publish }}" == "true" && "${GITHUB_REF_NAME}" != "lhc" ]]; then
            echo "publishing is restricted to the lhc product branch" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Test installer in isolated roots
        run: python3 scripts/lhc-release/test_install.py

      - name: Build release binaries
        working-directory: codex-rs
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --release --locked -p codex-cli -p codex-code-mode-host

      - name: Verify bare Codex captures to LHC by default
        run: >-
          python3 scripts/check-lhc-default-capture.py
          --binary codex-rs/target/release/codex

      - name: Assemble and verify release payload
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          asset="codex-lhc-v${VERSION}-linux-x86_64.tar.gz"
          stage="dist/payload"
          mkdir -p "$stage/bin"
          install -m 0755 codex-rs/target/release/codex "$stage/bin/codex"
          install -m 0755 codex-rs/target/release/codex-code-mode-host \
            "$stage/bin/codex-code-mode-host"
          strip "$stage/bin/codex" "$stage/bin/codex-code-mode-host"
          source_commit="$(git rev-parse HEAD)"
          upstream_commit="$(tr -d '[:space:]' < patches/lhc/BASE)"
          lhc_commit="$(git -C codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)"
          cat > "$stage/release-manifest.json" <<EOF
          {
            "product": "codex-lhc",
            "release_version": "${VERSION}",
            "platform": "linux-x86_64",
            "source_commit": "${source_commit}",
            "upstream_commit": "${upstream_commit}",
            "lhc_sdk_commit": "${lhc_commit}",
            "capture_default": "on"
          }
          EOF
          cat > "$stage/codex-package.json" <<EOF
          {
            "layoutVersion": 1,
            "version": "${VERSION}",
            "target": "x86_64-unknown-linux-gnu",
            "variant": "codex-lhc",
            "entrypoint": "bin/codex"
          }
          EOF
          cp LICENSE "$stage/LICENSE"
          cp "$stage/release-manifest.json" dist/release-manifest.json
          tar -C "$stage" -czf "dist/$asset" .
          install -m 0755 scripts/lhc-release/install.sh dist/install.sh
          (cd dist && sha256sum "$asset" install.sh release-manifest.json > SHA256SUMS)
          dist/payload/bin/codex --version
          dist/payload/bin/codex-code-mode-host --help >/dev/null
          tar -tzf "dist/$asset"
          (cd dist && sha256sum -c SHA256SUMS)
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload validated release candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-v${{ steps.release.outputs.version }}-linux-x86_64
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/install.sh
            dist/release-manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish v${{ needs.build-linux.outputs.version }}
    needs: build-linux
    if: inputs.publish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Checkout release notes source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-v${{ needs.build-linux.outputs.version }}-linux-x86_64
          path: dist

      - name: Reverify and write release notes
        shell: bash
        env:
          VERSION: ${{ needs.build-linux.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          source_commit="$(git rev-parse HEAD)"
          lhc_commit="$(git -C codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)"
          cat > RELEASE_NOTES.md <<EOF
          ## Codex + LHC v${VERSION}

          First Linux x86_64 release of the maintained Codex fork with LHC
          long-horizon context, stable turn/message IDs, and direct
          get_turns / get_messages retrieval.

          - Product source: ${source_commit}
          - LHC SDK: ${lhc_commit}
          - Capture: enabled by default; disable lhc_capture only for troubleshooting
          - Platform: Linux x86_64 (Ubuntu 24.04/glibc build)

          LHC preserves full transcripts and derived views. Long sessions can
          use substantially more disk space than stock Codex.

          ### Install

          install.sh installs as codex when no Codex command exists,
          otherwise as codex-lhc. Use --name for another command.

              curl -fsSLO https://github.com/liminal-ai/codex-lhc/releases/download/v${VERSION}/install.sh
              sh install.sh --version ${VERSION}

          This is not an official OpenAI release. See SHA256SUMS and
          release-manifest.json for artifact identity and provenance.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: v${{ needs.build-linux.outputs.version }}
          name: Codex + LHC v${{ needs.build-linux.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/codex-lhc-v${{ needs.build-linux.outputs.version }}-linux-x86_64.tar.gz
            dist/install.sh
            dist/release-manifest.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
