# Build one immutable Linux Codex-LHC candidate. Publishing is a separate
# protected workflow and must consume these exact artifacts after smoke.
name: Codex LHC candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the v prefix"
        required: true
        default: "0.2.1"
        type: string

permissions:
  contents: read

concurrency:
  group: codex-lhc-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build linux-x86_64
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 180
    env:
      PLATFORM: linux-x86_64
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Validate release identity
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$VERSION" = "$(tr -d '[:space:]' < lhc-release/VERSION)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/cli/Cargo.toml)"
          test "$VERSION" = "$cargo_version"
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Test Linux installer
        run: python3 scripts/lhc-release/test_install.py
      - name: Build release binaries
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" \
            -p codex-cli -p codex-code-mode-host
      - name: Verify bare Codex captures to LHC by default
        run: >-
          python3 scripts/check-lhc-default-capture.py
          --binary "$CARGO_TARGET_DIR/$TARGET/release/codex"
      - name: Package Linux candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          stage="dist/payload"
          mkdir -p "$stage/bin"
          release_dir="$CARGO_TARGET_DIR/$TARGET/release"
          install -m 0755 "$release_dir/codex" "$stage/bin/codex"
          install -m 0755 "$release_dir/codex-code-mode-host" "$stage/bin/codex-code-mode-host"
          strip "$stage/bin/codex" "$stage/bin/codex-code-mode-host"
          cp LICENSE "$stage/LICENSE"
          lhc_sdk_commit="$(git -C lhc/vendor/long-horizon-context rev-parse HEAD)"
          printf '{"product":"codex-lhc","release":"%s","platform":"%s","lhcSdkCommit":"%s","lhcThreadSchema":6}\n' \
            "$VERSION" "$PLATFORM" "$lhc_sdk_commit" > "$stage/release-manifest.json"
          tar -C "$stage" -czf "dist/codex-lhc-v${VERSION}-${PLATFORM}.tar.gz" .
          "$stage/bin/codex" --version
          "$stage/bin/codex-code-mode-host" --help >/dev/null
      - name: Upload Linux candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-linux-x86_64
          path: dist/codex-lhc-v${{ inputs.version }}-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Assemble immutable candidate
    needs: build-linux
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-linux-x86_64
          path: candidate
      - name: Generate release manifest and checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          install -m 0755 scripts/lhc-release/install.sh candidate/install.sh
          python3 scripts/lhc-release/make_manifest.py \
            --dist candidate \
            --version "$VERSION" \
            --source-commit "$(git rev-parse HEAD)" \
            --upstream-commit "$(tr -d '[:space:]' < patches/lhc/BASE)" \
            --lhc-sdk-commit "$(git -C codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID"
          (cd candidate && sha256sum -c SHA256SUMS)
          python3 -m json.tool candidate/release-manifest.json >/dev/null
      - name: Upload immutable candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-v${{ inputs.version }}-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
