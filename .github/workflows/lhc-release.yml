# Build an immutable Codex-LHC release candidate. Publishing is a separate
# workflow and must consume these exact artifacts after Daytona smoke tests.
name: Codex LHC candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the v prefix"
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: codex-lhc-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: blacksmith-32vcpu-ubuntu-2404
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            kind: unix
          - label: windows-x86_64
            runner: blacksmith-32vcpu-windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            kind: windows
          - label: macos-aarch64
            runner: macos-15
            platform: macos-aarch64
            target: aarch64-apple-darwin
            kind: unix
          - label: macos-x86_64
            runner: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            kind: unix
    steps:
      - name: Checkout product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Validate release identity
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$VERSION" = "$(tr -d '[:space:]' < lhc-release/VERSION)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' codex-rs/cli/Cargo.toml)"
          test "$VERSION" = "$cargo_version"

      - uses: ./.github/actions/setup-ci
        if: matrix.kind != 'windows'
      - name: Configure Windows build paths
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $target = Join-Path $env:RUNNER_TEMP "ct"
          New-Item $target -ItemType Directory -Force | Out-Null
          "CARGO_TARGET_DIR=$target" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
        if: matrix.kind == 'windows'
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Test POSIX installer
        if: matrix.platform == 'linux-x86_64'
        run: python3 scripts/lhc-release/test_install.py

      - name: Test Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./scripts/lhc-release/test_install.ps1

      - name: Build release binaries
        shell: bash
        working-directory: codex-rs
        env:
          LIBSQLITE3_FLAGS: ${{ matrix.kind == 'windows' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target '${{ matrix.target }}' \
            -p codex-cli -p codex-code-mode-host

      - name: Package Unix candidate
        if: matrix.kind == 'unix'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="dist/payload"
          mkdir -p "$stage/bin"
          release_dir="$CARGO_TARGET_DIR/$TARGET/release"
          install -m 0755 "$release_dir/codex" "$stage/bin/codex"
          install -m 0755 "$release_dir/codex-code-mode-host" "$stage/bin/codex-code-mode-host"
          strip "$stage/bin/codex" "$stage/bin/codex-code-mode-host"
          cp LICENSE "$stage/LICENSE"
          printf '{"product":"codex-lhc","release":"%s","platform":"%s"}\n' \
            "$VERSION" "$PLATFORM" > "$stage/release-manifest.json"
          tar -C "$stage" -czf "dist/codex-lhc-v${VERSION}-${PLATFORM}.tar.gz" .
          "$stage/bin/codex" --version
          "$stage/bin/codex-code-mode-host" --help >/dev/null

      - name: Package Windows candidate
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "dist\payload"
          New-Item "$stage\bin" -ItemType Directory -Force | Out-Null
          $releaseDir = Join-Path $env:CARGO_TARGET_DIR "$env:TARGET\release"
          Copy-Item "$releaseDir\codex.exe" "$stage\bin\codex.exe"
          Copy-Item "$releaseDir\codex-code-mode-host.exe" "$stage\bin\codex-code-mode-host.exe"
          Copy-Item LICENSE "$stage\LICENSE"
          @{ product = "codex-lhc"; release = $env:VERSION; platform = $env:PLATFORM } |
            ConvertTo-Json | Set-Content "$stage\release-manifest.json"
          Compress-Archive "$stage\*" "dist\codex-lhc-v$env:VERSION-$env:PLATFORM.zip"
          & "$stage\bin\codex.exe" --version
          & "$stage\bin\codex-code-mode-host.exe" --help | Out-Null

      - name: Upload platform candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-${{ matrix.platform }}
          path: dist/codex-lhc-v${{ inputs.version }}-*
          if-no-files-found: error
          retention-days: 14

  candidate:
    name: Assemble candidate
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-lhc-*
          path: candidate
          merge-multiple: true
      - name: Generate release manifest and checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          install -m 0755 scripts/lhc-release/install.sh candidate/install.sh
          install -m 0644 scripts/lhc-release/install.ps1 candidate/install.ps1
          python3 scripts/lhc-release/make_manifest.py \
            --dist candidate \
            --version "$VERSION" \
            --source-commit "$(git rev-parse HEAD)" \
            --upstream-commit "$(tr -d '[:space:]' < patches/lhc/BASE)" \
            --lhc-sdk-commit "$(git -C codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID"
          (cd candidate && sha256sum -c SHA256SUMS)
          python3 -m json.tool candidate/release-manifest.json >/dev/null
      - name: Upload immutable candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-v${{ inputs.version }}-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
