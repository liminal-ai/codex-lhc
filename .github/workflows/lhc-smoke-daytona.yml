name: Codex LHC Daytona smoke

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful Codex LHC candidate workflow run id"
        required: true
        type: string
      version:
        description: "Candidate SemVer"
        required: true
        default: "0.1.0"
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: codex-lhc-daytona-${{ inputs.candidate_run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke ${{ matrix.platform }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            script: scripts/daytona-smoke/smoke_linux.py
          - platform: windows
            script: scripts/daytona-smoke/smoke_windows.py
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-v${{ inputs.version }}-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify candidate checksums and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
          for artifact in candidate/codex-lhc-v* candidate/install.sh candidate/install.ps1 candidate/release-manifest.json candidate/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
      - name: Install Daytona SDK
        run: pip install --requirement scripts/daytona-smoke/requirements.txt
      - name: Run smoke
        env:
          CODEX_LHC_CANDIDATE_DIR: ${{ github.workspace }}/candidate
          CODEX_LHC_VERSION: ${{ inputs.version }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: python ${{ matrix.script }}
