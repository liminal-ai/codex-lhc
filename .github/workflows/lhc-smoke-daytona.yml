name: Codex LHC platform smoke

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful Codex LHC candidate workflow run id"
        required: true
        type: string
      version:
        description: "Candidate SemVer"
        required: true
        default: "0.2.1"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-lhc-daytona-${{ inputs.candidate_run_id }}
  cancel-in-progress: false

jobs:
  smoke-linux:
    name: Smoke Linux
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-v${{ inputs.version }}-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify candidate checksums
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
      - name: Install Daytona SDK
        run: pip install --requirement scripts/daytona-smoke/requirements.txt
      - name: Run smoke
        env:
          CODEX_LHC_CANDIDATE_DIR: ${{ github.workspace }}/candidate
          CODEX_LHC_VERSION: ${{ inputs.version }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: python scripts/daytona-smoke/smoke_linux.py
      - name: Record qualification evidence
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("qualification.json").write_text(json.dumps({
              "candidate_run_id": os.environ["CANDIDATE_RUN_ID"],
              "version": os.environ["VERSION"],
              "result": "passed",
              "platform": "linux-x86_64",
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-qualification-${{ inputs.candidate_run_id }}
          path: qualification.json
          if-no-files-found: error
          retention-days: 30
