# Build Windows x86_64 and macOS ARM64 from the exact source of a qualified
# Linux candidate. Does not rebuild Linux. Outputs a combined release bundle
# with all three platform archives, both installers, and unified manifest.
name: Codex LHC supplemental platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match the candidate)"
        required: true
        type: string
      candidate_run_id:
        description: "Successful Linux candidate workflow run ID"
        required: true
        type: string
      smoke_run_id:
        description: "Successful Linux smoke workflow run ID"
        required: true
        type: string
      mode:
        description: "forward = no existing tag/release; backfill = tag+release must match candidate SHA"
        required: true
        type: choice
        options:
          - forward
          - backfill

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-lhc-supplemental-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-linux:
    name: Verify Linux qualification
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download Linux candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-v${{ inputs.version }}-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download smoke qualification artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-qualification-${{ inputs.candidate_run_id }}
          path: qualification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.smoke_run_id }}
      - name: Verify candidate, smoke, and tag/release gate
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test -f qualification/qualification.json
          candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          smoke="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SMOKE_RUN_ID")"
          test "$(jq -r .conclusion <<<"$candidate")" = success
          test "$(jq -r .path <<<"$candidate")" = .github/workflows/lhc-release.yml
          test "$(jq -r .conclusion <<<"$smoke")" = success
          test "$(jq -r .path <<<"$smoke")" = .github/workflows/lhc-smoke-daytona.yml
          candidate_sha="$(jq -r .head_sha <<<"$candidate")"
          smoke_sha="$(jq -r .head_sha <<<"$smoke")"
          test "$candidate_sha" = "$smoke_sha"
          python3 - "$candidate_sha" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          version = os.environ["VERSION"]
          candidate_run = os.environ["CANDIDATE_RUN_ID"]
          candidate_sha = sys.argv[1]
          manifest = json.loads(Path("candidate/release-manifest.json").read_text())
          assert manifest["release"] == version, manifest.get("release")
          source = manifest["sourceCommit"]
          sdk = manifest["lhcSdkCommit"]
          assert re.fullmatch(r"[0-9a-f]{40}", source), source
          assert re.fullmatch(r"[0-9a-f]{40}", sdk), sdk
          assert source == candidate_sha, (source, candidate_sha)
          assert manifest["buildRunId"] == candidate_run, manifest.get("buildRunId")
          platforms = [item["platform"] for item in manifest["artifacts"]]
          assert platforms == ["linux-x86_64"], platforms
          evidence = json.loads(Path("qualification/qualification.json").read_text())
          assert evidence == {
              "candidate_run_id": candidate_run,
              "version": version,
              "result": "passed",
              "platform": "linux-x86_64",
          }, evidence
          Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8").write(f"source_sha={source}\n")
          print(f"Verified Linux candidate {source} / SDK {sdk}")
          PY

          git fetch --tags origin || true
          scripts/lhc-release/tag_release_gate.sh "$MODE" "$VERSION" "$candidate_sha"

  build-windows:
    name: Build windows-x86_64
    needs: verify-linux
    runs-on: blacksmith-32vcpu-windows-2025
    timeout-minutes: 180
    env:
      PLATFORM: windows-x86_64
      TARGET: x86_64-pc-windows-msvc
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ needs.verify-linux.outputs.source_sha }}
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-linux.outputs.source_sha }}
          path: product
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Checkout workflow/infra source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: infra
          persist-credentials: false
          fetch-depth: 0
      - name: Configure Windows build paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $target = Join-Path $env:RUNNER_TEMP "ct"
          New-Item $target -ItemType Directory -Force | Out-Null
          "CARGO_TARGET_DIR=$target" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release binaries
        shell: pwsh
        working-directory: product/codex-rs
        run: |
          cargo build --release --locked --target $env:TARGET `
            -p codex-cli -p codex-code-mode-host
      - name: Package Windows candidate
        shell: pwsh
        run: |
          $stage = "dist\payload"
          New-Item -Force -ItemType Directory $stage\bin | Out-Null
          $rel = Join-Path $env:CARGO_TARGET_DIR "$env:TARGET\release"
          Copy-Item "$rel\codex.exe" "$stage\bin\codex.exe"
          Copy-Item "$rel\codex-code-mode-host.exe" "$stage\bin\codex-code-mode-host.exe"
          Copy-Item product\LICENSE "$stage\LICENSE"
          $lhcSdk = (git -C product/codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD).Trim()
          $source = (git -C product rev-parse HEAD).Trim()
          if ($source -ne $env:SOURCE_SHA) { throw "product checkout $source != $env:SOURCE_SHA" }
          $manifest = @{
            product = "codex-lhc"
            release = $env:VERSION
            platform = $env:PLATFORM
            sourceCommit = $source
            lhcSdkCommit = $lhcSdk
            lhcThreadSchema = 11
          } | ConvertTo-Json
          Set-Content "$stage\release-manifest.json" $manifest -Encoding utf8
          New-Item -Force -ItemType Directory dist | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\codex-lhc-v$($env:VERSION)-$($env:PLATFORM).zip"
          & "$stage\bin\codex.exe" --version
          & "$stage\bin\codex-code-mode-host.exe" --help | Out-Null
      - name: Test Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "dist\codex-lhc-v$env:VERSION-windows-x86_64.zip"
          if (-not (Test-Path $archive)) { throw "missing $archive" }
          Expand-Archive $archive -DestinationPath candidate-test
          & candidate-test\bin\codex.exe --version
          if ($LASTEXITCODE) { throw "codex.exe --version failed: $LASTEXITCODE" }
          & candidate-test\bin\codex-code-mode-host.exe --help | Out-Null
          if ($LASTEXITCODE) { throw "codex-code-mode-host.exe --help failed: $LASTEXITCODE" }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content dist\SHA256SUMS "$hash  $(Split-Path $archive -Leaf)"
          $prefix = Join-Path $env:RUNNER_TEMP "codex-lhc-supp-prefix"
          $store = Join-Path $env:RUNNER_TEMP "codex-lhc-supp-store"
          # install.ps1 candidate mode reads the zip + SHA256SUMS from -AssetDir
          powershell -File infra\scripts\lhc-release\install.ps1 `
            -AssetDir (Resolve-Path dist) `
            -Name codex-test-supplemental `
            -Prefix $prefix `
            -InstallRoot $store `
            -Version $env:VERSION
          $env:Path = "$(Join-Path $prefix 'bin');$env:Path"
          $launcher = Join-Path $prefix "bin\codex-test-supplemental.cmd"
          if (-not (Test-Path $launcher)) { throw "launcher missing: $launcher" }
          $launcherText = Get-Content $launcher -Raw
          $hostDir = Join-Path $store "versions\$env:VERSION"
          $hostBin = Join-Path $hostDir "bin\codex-code-mode-host.exe"
          if (-not (Test-Path $hostBin)) { throw "installed code-mode-host missing: $hostBin" }
          if ($launcherText -notmatch [regex]::Escape((Join-Path $hostDir 'bin\codex.exe'))) {
            throw "launcher does not resolve to installed codex.exe"
          }
          & $launcher --version
          if ($LASTEXITCODE) { throw "installed launcher failed: $LASTEXITCODE" }
          & $hostBin --help | Out-Null
          if ($LASTEXITCODE) { throw "installed code-mode-host --help failed: $LASTEXITCODE" }
          powershell -File infra\scripts\lhc-release\install.ps1 `
            -Name codex-test-supplemental `
            -Prefix $prefix `
            -InstallRoot $store `
            -Uninstall
          if (Test-Path $launcher) { throw "launcher survived uninstall: $launcher" }
      - name: Upload Windows archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-windows-x86_64
          path: dist/codex-lhc-v${{ inputs.version }}-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macos-aarch64
    needs: verify-linux
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 180
    env:
      PLATFORM: macos-aarch64
      TARGET: aarch64-apple-darwin
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ needs.verify-linux.outputs.source_sha }}
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-linux.outputs.source_sha }}
          path: product
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Checkout workflow/infra source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: infra
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: aarch64-apple-darwin
      - name: Build release binaries
        working-directory: product/codex-rs
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET" \
            -p codex-cli -p codex-code-mode-host
      - name: Package macOS candidate
        run: |
          set -euo pipefail
          stage="dist/payload"
          mkdir -p "$stage/bin" dist
          release_dir="${CARGO_TARGET_DIR:-product/codex-rs/target}/$TARGET/release"
          if [ ! -x "$release_dir/codex" ]; then
            release_dir="product/codex-rs/target/$TARGET/release"
          fi
          install -m 0755 "$release_dir/codex" "$stage/bin/codex"
          install -m 0755 "$release_dir/codex-code-mode-host" "$stage/bin/codex-code-mode-host"
          strip "$stage/bin/codex" "$stage/bin/codex-code-mode-host" 2>/dev/null || true
          cp product/LICENSE "$stage/LICENSE"
          source_sha="$(git -C product rev-parse HEAD)"
          test "$source_sha" = "$SOURCE_SHA"
          lhc_sdk_commit="$(git -C product/codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)"
          printf '{"product":"codex-lhc","release":"%s","platform":"%s","sourceCommit":"%s","lhcSdkCommit":"%s","lhcThreadSchema":11}\n' \
            "$VERSION" "$PLATFORM" "$source_sha" "$lhc_sdk_commit" > "$stage/release-manifest.json"
          tar -C "$stage" -czf "dist/codex-lhc-v${VERSION}-${PLATFORM}.tar.gz" .
          "$stage/bin/codex" --version
          "$stage/bin/codex-code-mode-host" --help >/dev/null
      - name: Test macOS installer
        run: |
          set -euo pipefail
          # test_install.py is a unittest of install.sh against a native-platform
          # fixture archive. It has no --platform flag and does not consume the
          # just-built tarball; on this macos-aarch64 runner it exercises the
          # installer script for macos-aarch64.
          python3 infra/scripts/lhc-release/test_install.py
          archive="dist/codex-lhc-v${VERSION}-macos-aarch64.tar.gz"
          test -f "$archive"
          digest="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$archive")" > dist/SHA256SUMS
          prefix="$(mktemp -d "${TMPDIR:-/tmp}/codex-lhc-macos-prefix.XXXXXX")"
          store="$(mktemp -d "${TMPDIR:-/tmp}/codex-lhc-macos-store.XXXXXX")"
          sh infra/scripts/lhc-release/install.sh \
            --asset-dir "$(pwd)/dist" \
            --version "$VERSION" \
            --name codex-test-supplemental \
            --prefix "$prefix" \
            --install-root "$store"
          launcher="$prefix/bin/codex-test-supplemental"
          test -L "$launcher"
          "$launcher" --version
          "$store/versions/${VERSION}/bin/codex-code-mode-host" --help >/dev/null
          sh infra/scripts/lhc-release/install.sh \
            --name codex-test-supplemental \
            --prefix "$prefix" \
            --install-root "$store" \
            --uninstall
          test ! -e "$launcher"
      - name: Upload macOS archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-macos-aarch64
          path: dist/codex-lhc-v${{ inputs.version }}-macos-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble combined bundle
    needs: [verify-linux, build-windows, build-macos]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ needs.verify-linux.outputs.source_sha }}
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.verify-linux.outputs.source_sha }}
          path: product
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Checkout workflow/infra source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: infra
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-v${{ inputs.version }}-candidate
          path: combined
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-windows-x86_64
          path: combined
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-macos-aarch64
          path: combined
      - name: Add installers
        run: |
          set -euo pipefail
          install -m 0755 infra/scripts/lhc-release/install.sh combined/install.sh
          cp infra/scripts/lhc-release/install.ps1 combined/install.ps1
      - name: Regenerate combined manifest and checksums
        run: |
          set -euo pipefail
          product_sha="$(git -C product rev-parse HEAD)"
          test "$product_sha" = "$SOURCE_SHA"
          python3 infra/scripts/lhc-release/make_manifest.py \
            --dist combined \
            --version "$VERSION" \
            --source-commit "$product_sha" \
            --upstream-commit "$(tr -d '[:space:]' < product/patches/lhc/BASE)" \
            --lhc-sdk-commit "$(git -C product/codex-rs/lhc/vendor/long-horizon-context rev-parse HEAD)" \
            --run-id "${{ inputs.candidate_run_id }}" \
            --supplemental-run-id "$GITHUB_RUN_ID" \
            --artifact-run "linux-x86_64:${{ inputs.candidate_run_id }}" \
            --artifact-run "windows-x86_64:${GITHUB_RUN_ID}" \
            --artifact-run "macos-aarch64:${GITHUB_RUN_ID}" \
            --expected-platform linux-x86_64 \
            --expected-platform windows-x86_64 \
            --expected-platform macos-aarch64
          (cd combined && sha256sum -c SHA256SUMS)
          python3 -m json.tool combined/release-manifest.json
      - name: Upload combined bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-lhc-v${{ inputs.version }}-combined
          path: combined/*
          if-no-files-found: error
          retention-days: 30
