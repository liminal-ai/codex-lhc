name: Promote exact Codex LHC candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "0.149.2"
        type: string
      candidate_run_id:
        description: "Successful five-platform candidate workflow run id"
        required: true
        type: string
      approval_record:
        description: "Audited maintainer record confirming both burn-ins and final review passed"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-lhc-public-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote accepted bytes and prove public postconditions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SOURCE_SHA: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require audited maintainer release credentials
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.CODEX_LHC_RELEASE_TOKEN }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TOKEN" || { echo "CODEX_LHC_RELEASE_TOKEN is required" >&2; exit 1; }
          test -n "$APPROVAL_RECORD" || { echo "approval_record is required" >&2; exit 1; }
          GH_TOKEN="$RELEASE_TOKEN" gh api user --jq .login
      - name: Verify exact successful candidate run
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(jq -r .conclusion <<<"$candidate")" = success
          test "$(jq -r .path <<<"$candidate")" = .github/workflows/lhc-release.yml
          source_sha="$(jq -r .head_sha <<<"$candidate")"
          test "$source_sha" = "$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-lhc-v${{ inputs.version }}-candidate
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Reverify exact immutable aggregate
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("candidate/release-manifest.json").read_text())
          assert manifest["release"] == os.environ["VERSION"]
          assert manifest["sourceCommit"] == os.environ["SOURCE_SHA"]
          assert manifest["buildRunId"] == os.environ["CANDIDATE_RUN_ID"]
          assert manifest["lhcSdkCommit"] == "e9456a6ee23a10cf04e15b16bcf77738c52b0f7c"
          assert manifest["compactAlgorithmDefault"] == "bounded-selector"
          assert manifest["compactAlgorithmRollback"] == {
              "environment": "LHC_COMPACT_ALGORITHM", "value": "legacy",
          }
          assert [item["platform"] for item in manifest["artifacts"]] == [
              "linux-aarch64", "linux-x86_64", "macos-aarch64",
              "windows-aarch64", "windows-x86_64",
          ]
          PY
      - name: Refuse an existing public identity
        env:
          GH_TOKEN: ${{ secrets.CODEX_LHC_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: scripts/lhc-release/tag_release_gate.sh forward "$VERSION" "$SOURCE_SHA"
      - name: Write exact release notes
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          APPROVAL_RECORD: ${{ inputs.approval_record }}
        run: |
          set -euo pipefail
          git show "${SOURCE_SHA}:lhc-release/notes/v${VERSION}.md" > RELEASE_NOTES.md
          head -1 RELEASE_NOTES.md | grep -qF "v${VERSION}"
          printf '\n---\n\n- Candidate workflow: %s\n- Approval record: %s\n- Platforms: linux-x86_64, linux-aarch64, windows-x86_64, windows-aarch64, macos-aarch64\n- This is not an official OpenAI release. Verify release-manifest.json and SHA256SUMS before installation.\n' \
            "$CANDIDATE_RUN_ID" "$APPROVAL_RECORD" >> RELEASE_NOTES.md
      - name: Publish exact candidate without rebuilding
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          token: ${{ secrets.CODEX_LHC_RELEASE_TOKEN }}
          tag_name: v${{ inputs.version }}
          name: Codex + LHC v${{ inputs.version }}
          target_commitish: ${{ steps.identity.outputs.source_sha }}
          body_path: RELEASE_NOTES.md
          files: |
            candidate/codex-lhc-v*-linux-x86_64.tar.gz
            candidate/codex-lhc-v*-linux-aarch64.tar.gz
            candidate/codex-lhc-v*-windows-x86_64.zip
            candidate/codex-lhc-v*-windows-aarch64.zip
            candidate/codex-lhc-v*-macos-aarch64.tar.gz
            candidate/install.sh
            candidate/install.ps1
            candidate/release-manifest.json
            candidate/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: false
      - name: Hard public tag, release, and exact-asset postconditions
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN python3 scripts/lhc-release/verify_public_release.py \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" \
            --source-sha "$SOURCE_SHA" --candidate-dir candidate
