[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode-runtime"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-code-mode-protocol = { workspace = true }
codex-protocol = { workspace = true }
deno_core_icudata = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
# Local-build workaround (G-hook, 2026-08-08): rusty_v8 150.4.0 publishes no
# x86_64-linux prebuilt for the sandbox variant (404), and building V8 from
# source is impractical here. The plain release prebuilt exists, so the
# sandbox feature is dropped for local builds. Revert when upstream's pin
# gains a published sandbox prebuilt.
v8 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
